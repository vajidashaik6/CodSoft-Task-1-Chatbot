<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusBuddy - Student Assistant</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="chat-container">

        <!-- HEADER -->

        <header class="header">

            <div class="profile">

                <div class="bot-avatar">
                    🎓
                </div>

                <div>
                    <h2>CampusBuddy</h2>

                    <p>
                        <span class="status"></span>
                        Student Assistant
                    </p>
                </div>

            </div>

           <div class="header-actions">

   <div class="badge">
    🧠 SMART RULES
</div>
    <button class="clear-btn" onclick="clearChat()">
        🗑️
    </button>

</div>
        </header>


        <!-- CHAT AREA -->

        <div class="chat-area" id="chatArea">

            <div class="message bot">

                <div class="avatar">
                    🤖
                </div>

                <div>

                    <div class="bubble">

                        Hey! 👋<br><br>

                        I'm <b>CampusBuddy</b> —
                        your student assistant.

                        <br><br>

                        I can help you with
                        📚 studies, 📝 exams,
                        💻 projects and 📅 planning.

                    </div>

                    <small>Just now</small>

                </div>

            </div>

        </div>


        <!-- QUICK OPTIONS -->

        <div class="quick-options">

            <button onclick="quickMessage('Give me study tips')">
                📚 Study
            </button>

            <button onclick="quickMessage('How can I prepare for exams?')">
                📝 Exams
            </button>

            <button onclick="quickMessage('Give me a project idea')">
                💻 Projects
            </button>

            <button onclick="quickMessage('Give me a study timetable')">
                📅 Timetable
            </button>

        </div>


        <!-- INPUT -->

        <div class="input-section">

            <input
                type="text"
                id="userInput"
                placeholder="Ask CampusBuddy something..."
            >

            <button onclick="sendMessage()" class="send">
                ➤
            </button>

        </div>


        <footer>
            CampusBuddy • Rule-Based Student Assistant
        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
